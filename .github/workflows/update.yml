name: Update source

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_OWNER: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: python3 scripts/build_source.py .

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add ytkace.json ytkace-ios16.json icon.png
          if git diff --cached --quiet; then
            echo "No new releases."
          else
            git commit -m "Update YTKACE source"
            git push
          fi
